[project]
name = "nexctf-sandbox"
version = "0.1.0"
description = "Sandboxed code execution for NexCTF, script checker and code runner via microsandbox microVMs."
authors = [
    { name = "NexCTF", email = "contact@nexctf.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "microsandbox>=0.6.14",
    "nexctf>=0.10,<1.0",
]

[project.urls]
Repository = "https://github.com/NexCTF/Sandbox"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "nexctf @ git+https://github.com/NexCTF/NexCTF.git@v0.10.0#subdirectory=backend",
]

[project.entry-points."nexctf.plugins"]
nexctf_sandbox = "nexctf_sandbox"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: boots a real microVM, needs /dev/kvm",
    "real_capability_probe: runs the real CAP_NET_ADMIN probe, not the test stand-in",
]
addopts = "-m 'not live'"  # opt in with: pytest -m live
